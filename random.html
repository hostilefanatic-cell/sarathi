<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Word - Sarathi</title>
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="back-button">
                <a href="index.html" class="btn-back">← Back</a>
            </div>
            <div class="logo">
                <h1>GEETHA SARATHI</h1>
            </div>
            <div class="language-selector">
                <label for="language">Language:</label>
                <select id="language" class="language-dropdown">
                    <option value="sanskrit">संस्कृतम् (Sanskrit)</option>
                    <option value="kannada">ಕನ್ನಡ (Kannada)</option>
                    <option value="tamil">தமிழ் (Tamil)</option>
                    <option value="english">English</option>
                </select>
            </div>
        </div>
    </header>

    <main class="main-content">
        <section class="page-header">
            <h2>Random Word Generator</h2>
        </section>

        <section class="filter-section">
            <div class="filter-group">
                <label for="occurrenceFilter" class="filter-label">Filter by occurrences:</label>
                <select id="occurrenceFilter" class="filter-dropdown">
                    <option value="all">All words</option>
                    <option value="1-2">Rare (1-2 times)</option>
                    <option value="3-5">Uncommon (3-5 times)</option>
                    <option value="6-10">Common (6-10 times)</option>
                    <option value="10+">Very common (10+ times)</option>
                </select>
            </div>

            <div class="filter-group">
                <label class="filter-label">Chapter range:</label>
                <div class="chapter-range">
                    <select id="chapterFrom" class="filter-dropdown chapter-select">
                        <option value="1">Chapter 1</option>
                        <option value="2">Chapter 2</option>
                        <option value="3">Chapter 3</option>
                        <option value="4">Chapter 4</option>
                        <option value="5">Chapter 5</option>
                        <option value="6">Chapter 6</option>
                        <option value="7">Chapter 7</option>
                        <option value="8">Chapter 8</option>
                        <option value="9">Chapter 9</option>
                        <option value="10">Chapter 10</option>
                        <option value="11">Chapter 11</option>
                        <option value="12">Chapter 12</option>
                        <option value="13">Chapter 13</option>
                        <option value="14">Chapter 14</option>
                        <option value="15">Chapter 15</option>
                        <option value="16">Chapter 16</option>
                        <option value="17">Chapter 17</option>
                        <option value="18">Chapter 18</option>
                    </select>
                    <span class="range-separator">to</span>
                    <select id="chapterTo" class="filter-dropdown chapter-select">
                        <option value="1">Chapter 1</option>
                        <option value="2">Chapter 2</option>
                        <option value="3">Chapter 3</option>
                        <option value="4">Chapter 4</option>
                        <option value="5">Chapter 5</option>
                        <option value="6">Chapter 6</option>
                        <option value="7">Chapter 7</option>
                        <option value="8">Chapter 8</option>
                        <option value="9">Chapter 9</option>
                        <option value="10">Chapter 10</option>
                        <option value="11">Chapter 11</option>
                        <option value="12">Chapter 12</option>
                        <option value="13">Chapter 13</option>
                        <option value="14">Chapter 14</option>
                        <option value="15">Chapter 15</option>
                        <option value="16">Chapter 16</option>
                        <option value="17">Chapter 17</option>
                        <option value="18" selected>Chapter 18</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="card-container">
            <div class="flash-card" id="flashCard">
                <div class="card-front" id="cardFront">
                    <div class="card-content">
                        <div id="wordDisplay" class="word-display">
                            <p class="initial-message">Click to generate<br>a random word</p>
                            <div class="generate-icon">↻</div>
                        </div>
                        <div id="wordInfo" class="word-info" style="display: none;">
                            <p class="instruction">Click to see verses</p>
                            <p class="occurrence-count"></p>
                        </div>
                    </div>
                </div>

                <div class="card-back" id="cardBack">
                    <div class="card-content">
                        <div id="versesDisplay" class="verses-display">
                            <!-- Verses will be populated here -->
                        </div>
                        <button class="btn-secondary flip-back" onclick="event.stopPropagation(); flipToFront();">Click to flip back</button>
                    </div>
                </div>
            </div>
        </section>

        <section class="action-buttons">
            <button id="generateBtn" class="btn-primary">Generate Random Word</button>
        </section>

        <div id="loading" class="loading" style="display: none;">
            <p>Loading...</p>
        </div>
    </main>

    <footer class="footer">
        <p>Made with ♥ for Sanskrit learners</p>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/random.js"></script>
</body>
</html>
