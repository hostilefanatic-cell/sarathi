<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Search - Sarathi</title>
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="back-button">
                <a href="index.html" class="btn-back">← Back</a>
            </div>
            <div class="logo">
                <h1>GEETHA SARATHI</h1>
            </div>
            <div class="language-selector">
                <label for="language">Language:</label>
                <select id="language" class="language-dropdown">
                    <option value="sanskrit">संस्कृतम् (Sanskrit)</option>
                    <option value="kannada">ಕನ್ನಡ (Kannada)</option>
                    <option value="tamil">தமிழ் (Tamil)</option>
                    <option value="english">English</option>
                </select>
            </div>
        </div>
    </header>

    <main class="main-content">
        <section class="page-header">
            <h2>Search for a Word</h2>
        </section>

        <section class="search-container">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    placeholder="Enter word in Sanskrit"
                    autocomplete="off"
                >
                <button id="clearBtn" class="clear-btn" style="display: none;">×</button>
            </div>
            <button id="searchBtn" class="btn-primary search-btn">Search</button>
        </section>

        <section class="popular-words" id="popularWords">
            <p class="popular-label">Popular words:</p>
            <div class="word-tags" id="wordTags">
                <!-- Popular words will be populated here -->
            </div>
        </section>

        <section class="results-container" id="resultsContainer" style="display: none;">
            <div class="results-header" id="resultsHeader">
                <!-- Results count will be shown here -->
            </div>
            <div class="results-list" id="resultsList">
                <!-- Search results will be populated here -->
            </div>
        </section>

        <section class="no-results" id="noResults" style="display: none;">
            <p class="no-results-icon">😔</p>
            <p class="no-results-message">This word doesn't appear in the Bhagavad Gita</p>
            <p class="try-again">Try searching for:</p>
            <div class="word-tags" id="suggestedWords">
                <!-- Suggested words will be shown here -->
            </div>
        </section>

        <div id="loading" class="loading" style="display: none;">
            <p>Searching...</p>
        </div>
    </main>

    <footer class="footer">
        <p>Made with ♥ for Sanskrit learners</p>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/search.js"></script>
</body>
</html>
